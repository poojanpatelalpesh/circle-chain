<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Circle Chain: a creature made of math</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600&family=Syne:wght@700;800&family=STIX+Two+Text:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eff1;--ink:#10303d;--grid:rgba(16,48,61,.08);--panel:#f7fafb;--accent:#e4572e;--muted:#4d6a77;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d2530;--ink:#d6eaf0;--grid:rgba(214,234,240,.07);--panel:#14343f;--accent:#ff8a5c;--muted:#8fb0bc}}
:root[data-theme="dark"]{--bg:#0d2530;--ink:#d6eaf0;--grid:rgba(214,234,240,.07);--panel:#14343f;--accent:#ff8a5c;--muted:#8fb0bc}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Familjen Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
#panel{position:absolute;left:12px;top:calc(12px + env(safe-area-inset-top,0px));width:292px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;background:var(--panel);border:1.5px solid var(--ink);border-radius:14px;padding:12px 14px;box-sizing:border-box}
summary{font-family:'Syne',sans-serif;font-weight:800;font-size:19px;cursor:pointer}
.row{margin:9px 0 0}
.row label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.row b{color:var(--ink);font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent);margin:2px 0 0}
select,button{font:inherit;font-size:13px;color:var(--ink);background:transparent;border:1.5px solid var(--ink);border-radius:8px;padding:4px 8px;cursor:pointer}
button:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pre{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chk{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px;font-size:13px}
.chk label{display:flex;gap:4px;align-items:center;cursor:pointer}
#math{margin-top:12px;padding-top:10px;border-top:1.5px dashed var(--muted);font-family:'STIX Two Text','Cambria Math',Georgia,serif;font-size:14px;line-height:1.55}
#math i{color:var(--accent);font-style:normal}
#score{font-family:'Syne',sans-serif;position:absolute;right:16px;top:calc(12px + env(safe-area-inset-top,0px));font-weight:800;font-size:44px;line-height:1}
#score small{display:block;font-family:'Familjen Grotesk',sans-serif;font-size:13px;font-weight:400;color:var(--muted);text-align:right}
@media (max-width:700px){#panel{top:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));left:8px;right:8px;width:auto;max-height:55%}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="score"><span id="sc">0</span><small>food eaten, each adds a circle</small></div>
<details id="panel">
<summary>Circle Chain</summary>
<div class="pre" id="pre"></div>
<div id="ctl"></div>
<div class="row"><label>Radius profile</label>
<select id="prof"><option value="fish">Fish: sine hump</option><option value="linear">Linear: r₀(1+g·t)</option><option value="geo">Geometric: r₀(1+g)ᵗ</option><option value="const">Constant: r₀</option></select></div>
<div class="chk" id="chk"></div>
<div id="math"></div>
</details>
<script>
const $=id=>document.getElementById(id), cv=$('c'), ctx=cv.getContext('2d');
const P={n:26,r0:30,gap:.75,g:-.6,prof:'fish',wig:.5,dh:6,hue:175,body:true,circ:false,skel:false,fin:true};
const SL=[['n','Circles (n)',2,80,1],['r0','Base radius r₀',5,60,1],['gap','Spacing k',.3,1.3,.01],['g','Growth g',-.95,2,.01],['wig','Wiggle',0,1,.01],['dh','Colour drift',0,30,1],['hue','Hue',0,360,1]];
const CK=[['body','Body'],['circ','Circles'],['skel','Skeleton'],['fin','Tail fin']];
const PRE={Fish:{prof:'fish',n:26,r0:30,gap:.75,wig:.5,body:true,circ:false,skel:false,fin:true,hue:175},
Snake:{prof:'linear',n:46,r0:20,gap:.85,g:-.75,wig:.35,fin:false,body:true,hue:95},
Caterpillar:{prof:'const',n:12,r0:24,gap:1,wig:.2,fin:false,circ:true,body:false,dh:14,hue:70},
Whip:{prof:'geo',n:64,r0:24,gap:.7,g:-.96,wig:.6,fin:false,body:true,hue:330},
Tadpole:{prof:'linear',n:30,r0:12,gap:.8,g:1.6,wig:.7,fin:false,body:true,hue:20}};
let S=[],m={x:innerWidth*.6,y:innerHeight*.5},W,H,t=0,score=0,food=null,col={};
const fmt=(k,v)=>k==='g'?Math.round(v*100)+'%':k==='gap'||k==='wig'?(+v).toFixed(2):Math.round(v);
$('ctl').innerHTML=SL.map(([k,l,a,b,s])=>`<div class="row"><label>${l}<b id="v_${k}"></b></label><input type="range" id="i_${k}" min="${a}" max="${b}" step="${s}"></div>`).join('');
$('chk').innerHTML=CK.map(([k,l])=>`<label><input type="checkbox" id="k_${k}">${l}</label>`).join('');
$('pre').innerHTML=Object.keys(PRE).map(k=>`<button data-p="${k}">${k}</button>`).join('');
function sync(){SL.forEach(([k])=>{$('i_'+k).value=P[k];$('v_'+k).textContent=fmt(k,P[k])});CK.forEach(([k])=>$('k_'+k).checked=P[k]);$('prof').value=P.prof;fit()}
SL.forEach(([k])=>$('i_'+k).oninput=e=>{P[k]=+e.target.value;$('v_'+k).textContent=fmt(k,P[k]);if(k==='n')fit()});
CK.forEach(([k])=>$('k_'+k).onchange=e=>P[k]=e.target.checked);
$('prof').onchange=e=>P.prof=e.target.value;
$('pre').onclick=e=>{const p=PRE[e.target.dataset.p];if(p){Object.assign(P,{g:-.6,dh:6,circ:false,skel:false},p);sync()}};
if(innerWidth>700)$('panel').open=true;
function fit(){const h=S.length?S[0]:{x:W/2,y:H/2};while(S.length<P.n){const l=S[S.length-1]||h;S.push({x:l.x-.01,y:l.y})}S.length=P.n}
// radius of circle i: the heart of the "design" of the creature
function rad(i){const n=P.n,t=n>1?i/(n-1):0;let r;
 if(P.prof==='const')r=P.r0;
 else if(P.prof==='linear')r=P.r0*(1+P.g*t);
 else if(P.prof==='geo')r=P.r0*Math.pow(1+P.g,t);
 else r=P.r0*Math.sin(Math.PI*Math.pow(.1+.9*t,.7));
 return Math.max(r,2.5)}
function size(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',size);size();
cv.addEventListener('pointermove',e=>{m.x=e.clientX;m.y=e.clientY});
cv.addEventListener('pointerdown',e=>{m.x=e.clientX;m.y=e.clientY});
function spawn(){const pw=W>700?$('panel').offsetWidth+40:30,bot=W>700?30:H*.6;food={x:pw+Math.random()*(W-pw-60),y:60+Math.random()*(bot>H?H-100:H-bot-80),r:9}}
function colors(){const s=getComputedStyle(document.documentElement);['bg','ink','grid','accent'].forEach(k=>col[k]=s.getPropertyValue('--'+k).trim())}
function smooth(p,first){ // quadratic curve through midpoints: smooth outline from raw points
 if(first)ctx.moveTo(p[0].x,p[0].y);else ctx.lineTo(p[0].x,p[0].y);
 for(let i=1;i<p.length-1;i++)ctx.quadraticCurveTo(p[i].x,p[i].y,(p[i].x+p[i+1].x)/2,(p[i].y+p[i+1].y)/2);
 const l=p[p.length-1];ctx.lineTo(l.x,l.y)}
function step(){
 const n=P.n,a=S[0],b=S[1];let hx=a.x-b.x,hy=a.y-b.y,hl=Math.hypot(hx,hy)||1;hx/=hl;hy/=hl;
 const dx=m.x-a.x,dy=m.y-a.y,dist=Math.hypot(dx,dy);
 if(dist>1){const sp=Math.min(dist*.14,12+P.r0*.15);a.x+=dx/dist*sp;a.y+=dy/dist*sp}
 const lat=Math.sin(t*5)*P.wig*4*Math.min(1,dist/60);a.x+=-hy*lat;a.y+=hx*lat; // sine wave sideways along the normal
 for(let i=1;i<n;i++){const p=S[i-1],q=S[i],d=P.gap*(rad(i-1)+rad(i));
  let ux=q.x-p.x,uy=q.y-p.y,L=Math.hypot(ux,uy);if(L<1e-6){ux=-1;uy=0;L=1}
  q.x=p.x+ux/L*d;q.y=p.y+uy/L*d} // unit vector times d: the follow rule
 if(food&&Math.hypot(a.x-food.x,a.y-food.y)<rad(0)+food.r){score++;$('sc').textContent=score;if(P.n<80){P.n++;$('i_n').value=P.n;$('v_n').textContent=P.n;fit()}spawn()}
}
function angAt(i){const a=S[Math.max(i-1,0)],b=S[Math.min(i+1,P.n-1)];return Math.atan2(a.y-b.y,a.x-b.x)}
function draw(){
 const n=P.n,A=[],R=[],Lp=[],Rp=[];
 ctx.fillStyle=col.bg;ctx.fillRect(0,0,W,H);
 ctx.strokeStyle=col.grid;ctx.lineWidth=1;ctx.beginPath();
 for(let x=0;x<W;x+=40){ctx.moveTo(x,0);ctx.lineTo(x,H)}for(let y=0;y<H;y+=40){ctx.moveTo(0,y);ctx.lineTo(W,y)}ctx.stroke();
 for(let i=0;i<n;i++){const a=angAt(i),r=rad(i);A.push(a);R.push(r);
  const nx=-Math.sin(a),ny=Math.cos(a); // normal = heading rotated 90°
  Lp.push({x:S[i].x+nx*r,y:S[i].y+ny*r});Rp.push({x:S[i].x-nx*r,y:S[i].y-ny*r})}
 if(food){const k=food.r+2*Math.sin(t*4);ctx.fillStyle=col.accent;ctx.beginPath();ctx.arc(food.x,food.y,k,0,7);ctx.fill();
  ctx.strokeStyle=col.accent;ctx.globalAlpha=.4;ctx.beginPath();ctx.arc(food.x,food.y,k+7,0,7);ctx.stroke();ctx.globalAlpha=1}
 if(P.body){
  const T=S[n-1],aT=A[n-1],r0=R[0];
  if(P.fin){const bx=Math.cos(aT+Math.PI),by=Math.sin(aT+Math.PI),nx=-Math.sin(aT),ny=Math.cos(aT),f=P.r0*1.5,w=P.r0*.85;
   ctx.fillStyle=`hsl(${P.hue+n*P.dh} 60% 50%)`;ctx.beginPath();ctx.moveTo(T.x,T.y);
   ctx.quadraticCurveTo(T.x+bx*f*.6+nx*w*.4,T.y+by*f*.6+ny*w*.4,T.x+bx*f+nx*w,T.y+by*f+ny*w);
   ctx.quadraticCurveTo(T.x+bx*f*.55,T.y+by*f*.55,T.x+bx*f-nx*w,T.y+by*f-ny*w);
   ctx.quadraticCurveTo(T.x+bx*f*.6-nx*w*.4,T.y+by*f*.6-ny*w*.4,T.x,T.y);ctx.fill()}
  const path=new Path2D();const sv=ctx;ctx.save();
  ctx.beginPath();smooth(Lp,true);ctx.arc(T.x,T.y,R[n-1],aT+Math.PI/2,aT+Math.PI*1.5,false);
  smooth(Rp.slice().reverse(),false);ctx.arc(S[0].x,S[0].y,r0,A[0]-Math.PI/2,A[0]+Math.PI/2,false);ctx.closePath();
  ctx.fillStyle=`hsl(${P.hue} 50% 52%)`;ctx.fill();
  ctx.save();ctx.clip();
  for(let i=n-1;i>=0;i--){ctx.fillStyle=`hsl(${P.hue+i*P.dh} 70% ${i%2?58:50}% / .55)`;ctx.beginPath();ctx.arc(S[i].x,S[i].y,R[i],0,7);ctx.fill()}
  ctx.restore();
  ctx.strokeStyle=col.ink;ctx.lineWidth=2.5;ctx.stroke();ctx.restore();
  // eyes: head centre + forward * 0.35r ± normal * 0.5r
  const fx=Math.cos(A[0]),fy=Math.sin(A[0]),nx=-fy,ny=fx;
  [1,-1].forEach(s=>{const ex=S[0].x+fx*r0*.35+nx*r0*.5*s,ey=S[0].y+fy*r0*.35+ny*r0*.5*s;
   ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex,ey,r0*.2,0,7);ctx.fill();
   ctx.fillStyle=col.ink;ctx.beginPath();ctx.arc(ex+fx*r0*.06,ey+fy*r0*.06,r0*.1,0,7);ctx.fill()})
 }
 if(P.circ){ctx.lineWidth=1.5;for(let i=0;i<n;i++){ctx.strokeStyle=col.ink;ctx.globalAlpha=.7;ctx.beginPath();ctx.arc(S[i].x,S[i].y,R[i],0,7);ctx.stroke();ctx.globalAlpha=1}}
 if(P.skel){
  ctx.lineWidth=1;ctx.strokeStyle=col.ink;ctx.globalAlpha=.55;ctx.beginPath();
  for(let i=0;i<n;i++){ctx.moveTo(Lp[i].x,Lp[i].y);ctx.lineTo(Rp[i].x,Rp[i].y)}ctx.stroke();ctx.globalAlpha=1;
  ctx.strokeStyle=col.accent;ctx.lineWidth=2;ctx.beginPath();S.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();
  ctx.fillStyle=col.accent;S.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill()});
  ctx.fillStyle=col.ink;[...Lp,...Rp].forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,2,0,7);ctx.fill()});
  const h=S[0];ctx.strokeStyle=col.accent;ctx.beginPath();ctx.moveTo(h.x,h.y);ctx.lineTo(m.x,m.y);ctx.setLineDash([4,5]);ctx.stroke();ctx.setLineDash([])}
}
function readout(){
 const a=S[0],b=S[1],r0=rad(0),r1=rad(1),d=P.gap*(r0+r1),dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1;
 let len=0;for(let i=1;i<P.n;i++)len+=P.gap*(rad(i-1)+rad(i));
 const F={const:'rᵢ = r₀',linear:'rᵢ = r₀·(1 + g·t)',geo:'rᵢ = r₀·(1 + g)ᵗ',fish:'rᵢ = r₀·sin( π·(0.1+0.9t)^0.7 )'}[P.prof];
 $('math').innerHTML=`<i>Radius:</i> ${F}, t = i/(n−1)<br>
 <i>Spacing:</i> d₁ = k·(r₀+r₁) = ${P.gap.toFixed(2)}·(${r0.toFixed(1)}+${r1.toFixed(1)}) = <b>${d.toFixed(1)}</b><br>
 <i>Follow rule:</i> p₁ = p₀ + d₁·(p₁−p₀)/|p₁−p₀|<br>
 &nbsp;&nbsp;unit vector = (${(dx/L).toFixed(2)}, ${(dy/L).toFixed(2)}), length ${L.toFixed(1)} → ${d.toFixed(1)}<br>
 <i>Heading:</i> θ = atan2(Δy, Δx) = ${(Math.atan2(-dy,-dx)*180/Math.PI).toFixed(0)}°<br>
 <i>Outline:</i> pᵢ ± rᵢ·(−sin θᵢ, cos θᵢ)<br>
 <i>Body length:</i> Σdᵢ = ${len.toFixed(0)} px`}
let fr=0;colors();matchMedia('(prefers-color-scheme:dark)').addEventListener('change',colors);
sync();spawn();
for(let i=0;i<P.n;i++){S[i].x=W*.6-i*10;S[i].y=H*.5}
(function loop(){t+=.016;if(++fr%90===0)colors();step();draw();if(fr%6===0)readout();requestAnimationFrame(loop)})();
</script>
</body>
</html>
